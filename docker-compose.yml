services:
  db:
    image: postgres:16-alpine
    container_name: grademate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (copy .env.example first)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example first)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (copy .env.example first)}
    ports:
      # Loopback only: nothing outside this machine can reach PostgreSQL directly.
      - "127.0.0.1:5432:5432"
    volumes:
      - grademate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Text recognition for the scanned exams, backed by PaddleOCR-VL.
  ocr:
    build: ./services/ocr
    container_name: grademate-ocr
    restart: unless-stopped
    ports:
      # Loopback only: nothing outside this machine can reach the OCR service directly.
      - "127.0.0.1:8001:8001"
    environment:
      OCR_DEVICE: gpu:0
    volumes:
      - grademate_ocr_models:/models
    # PaddlePaddle needs more shared memory than Docker's 64 MB default.
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Local LLM inference (Qwen3), backed by Ollama. Used by TASK-011 (question
  # extraction) and TASK-012 (LaTeX repair) — nothing calls it yet.
  #
  # Shares the card with `ocr` and neither service gives its memory back by
  # going idle, so on a single 12 GB GPU only one of the two can actually run
  # at a time. There is no documented switch-over workflow yet; a script and
  # README section covering this are follow-up work, not implemented today.
  llm:
    image: ollama/ollama:latest
    container_name: grademate-llm
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "11434:11434"
    environment:
      # Idle period before Ollama unloads the model and frees the GPU on its
      # own. PaddleOCR-VL cannot do this — it holds GPU memory until the
      # container stops. Ollama can, natively.
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - grademate_llm_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # No curl/wget in this image; the `ollama` CLI itself talks to the local
      # server, which is enough to prove it is answering.
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Browser-based database client, for development only. Not part of the
  # default stack: start it explicitly with `docker compose --profile tools up -d adminer`.
  adminer:
    image: adminer:5
    container_name: grademate-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DEFAULT_DRIVER: pgsql
    depends_on:
      db:
        condition: service_healthy

volumes:
  grademate_pgdata:
  # PaddleOCR model weights, downloaded on the first request.
  grademate_ocr_models:
  # Ollama model weights, downloaded on the first pull.
  grademate_llm_models:
